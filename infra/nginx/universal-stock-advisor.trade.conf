# On the VPS (164.92.140.58): /etc/nginx/sites-available/universal-stock-advisor.trade
# One domain, like the owner's existing setup: /api/ → the production API, everything else →
# the web app (our Apache vhost). Both over WireGuard to the home server (10.0.0.2).
# The certbot-managed lines are the ones already on the VPS — keep them as they are.

# WebSocket upgrade header (live prices, notifications, streamed copilot answers at
# /api/v1/ws). Own variable name, so it can't clash with evolution's sites.
map $http_upgrade $usa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name universal-stock-advisor.trade www.universal-stock-advisor.trade;

    # One address for everyone (tokens are stored per site; www would be a second "site").
    if ($host = www.universal-stock-advisor.trade) {
        return 301 https://universal-stock-advisor.trade$request_uri;
    }

    # API + live updates → production API (10.0.0.2:8250; dev was 8200)
    location /api/ {
        proxy_pass http://10.0.0.2:8250;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $usa_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        # The WebSocket stays open while the app is open; copilot answers can take ~90 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Web app → our Apache vhost on :8000 (production build; dev was the Flutter server 8210)
    location / {
        proxy_pass http://10.0.0.2:8000;
        proxy_set_header Host universal-stock-advisor.trade;  # selects our Apache vhost
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/universal-stock-advisor.trade/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/universal-stock-advisor.trade/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.universal-stock-advisor.trade) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = universal-stock-advisor.trade) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name universal-stock-advisor.trade www.universal-stock-advisor.trade;
    return 404; # managed by Certbot
}
