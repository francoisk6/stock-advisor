# On the VPS (164.92.140.58): /etc/nginx/sites-available/universal-stock-advisor.trade
# Same pattern as evolution-portal.com: nginx terminates HTTP(S) and forwards over WireGuard
# to the home server (10.0.0.2). After enabling, run certbot (see docs/PRODUCTION.md); it adds
# the 443 blocks and the http→https redirect.

# WebSocket upgrade header for the API's live updates (own name: no clash with other sites).
map $http_upgrade $usa_connection_upgrade {
    default upgrade;
    ''      close;
}

# Web app → Apache vhost on the home server (:8000).
server {
    listen 80;
    server_name universal-stock-advisor.trade www.universal-stock-advisor.trade;

    location / {
        proxy_pass http://10.0.0.2:8000;
        proxy_set_header Host universal-stock-advisor.trade;  # selects our Apache vhost
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API (REST + WebSocket /api/v1/ws) → the API service on the home server's WireGuard address.
server {
    listen 80;
    server_name api.universal-stock-advisor.trade;
    client_max_body_size 1m;

    location / {
        proxy_pass http://10.0.0.2:8250;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $usa_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live updates and streamed copilot answers keep the connection open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
