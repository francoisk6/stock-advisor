# HTTPS for the closed beta. Host networking so Caddy can reach the API on 127.0.0.1:8250 and
# listen on 443 (the one deliberate public port); it never binds 80 (Apache/evolution).
#   cd infra/caddy && ACME_EMAIL=you@example.com docker compose up -d
services:
  caddy:
    image: caddy:2.10.2-alpine   # pinned; update deliberately
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    cpus: 0.5
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PROD_WEB_DIR:-/home/evo/stock-advisor/prod-web}:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
