# Only what we change; everything else comes from SearXNG's defaults.
use_default_settings: true

general:
  instance_name: "Stock Adviser search"

server:
  # Local-only service used by our backend; the rate limiter needs Redis and isn't needed here.
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  # The backend asks for JSON (the web UI stays available on 127.0.0.1:8220 for debugging).
  formats:
    - html
    - json

ui:
  query_in_title: false
