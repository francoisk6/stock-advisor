# Universal Stock Advisor — production web app (Flutter build), same pattern as evolution's
# flutter-wg vhost: the VPS nginx forwards the domain over WireGuard to Apache :8000.
# Installed by infra/apache/install_vhost.sh. The API does not go through Apache (the VPS
# forwards /api/ straight to 10.0.0.2:8250).
<VirtualHost *:8000>
    ServerName universal-stock-advisor.trade
    ServerAlias www.universal-stock-advisor.trade
    DocumentRoot /home/evo/stock-advisor/prod-web

    <Directory /home/evo/stock-advisor/prod-web>
        Require all granted
        Options -Indexes
        AllowOverride None
        # Flutter web SPA routing: unknown paths (/learn/…, email links) → index.html.
        # Never rewrite index.html itself: with an empty folder (before the first deploy)
        # that looped ("10 internal redirects", HTTP 500) instead of a plain 404.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/index\.html$
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /index.html [L]
    </Directory>

    <IfModule mod_headers.c>
        # New deploys must show up at once: never cache the app shell.
        <FilesMatch "^(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/universal_stock_advisor_error.log
    CustomLog ${APACHE_LOG_DIR}/universal_stock_advisor_access.log combined
</VirtualHost>
